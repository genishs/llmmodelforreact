# Qwen3.8-27B (Qwen3_5 하이브리드 아키텍처) LoRA Fine-tuning — C안
# ⚠️ 2026-08-30: 로더 패치(prefix remap) 적용 완료, CPU 합성모델 e2e 검증 통과.
#   실 27B 가중치 기준 s/step·GTT는 8-step 스모크로 실측 예정(본런 전 필수, PM 승인 후 진행).
#
# 🔴 target_modules 주의: Qwen3.8-27B는 model_type=qwen3_5, 64 레이어 중
#   full_attention_interval=4 → 16개만 full_attention(q_proj/k_proj/v_proj/o_proj),
#   나머지 48개(75%)는 linear_attention(게이트 선형어텐션, in_proj_qkv/in_proj_z/
#   in_proj_a/in_proj_b/out_proj 이름 사용). 기존 7B/14B/32B용 q/k/v/o_proj만 쓰면
#   레이어의 25%만 LoRA가 붙는다 — 반드시 아래 9종 전체를 넣을 것.
#   (실측: synthetic 8-layer 하이브리드 모델에서 CPU forward+backward로 검증됨 — 오선생 2026-08-29/30)
#
# 🔴 로더 패치 적용 완료(train_directml.py, 2026-08-30):
#   체크포인트 텐서명 model.language_model.layers.* (VL 전체 체크포인트 원본명) →
#   Qwen3_5ForCausalLM(텍스트 전용) 파라미터명 model.layers.*(language_model 접두어 없음)로
#   remap_checkpoint_key()/build_checkpoint_key_maps()가 자동 변환, model.visual.*·mtp.*는 스킵.
#   Qwen2.5/Mixtral 등 기존 체크포인트는 이 접두어 자체가 없어 identity(no-op) — 하위호환 실측 확인.
#   build()의 LoRA 부착검증도 확장: target_modules 전체(9종)가 실제로 붙었는지 isinstance(LoraLayer)
#   기반으로 검사, 하나라도 안 붙으면 즉시 RuntimeError(조용한 스킵 방지).

model:
  base_model: "/run/media/user/새 볼륨/ai_model/models/base/qwen3.8-27b"  # 2026-08-30: 2TB 아카이브로 이전(PM), 바이트 대조 완료
  model_type: "causal_lm"

lora:
  r: 16
  lora_alpha: 32
  target_modules:
    # full_attention 레이어(16/64)
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    # linear_attention 레이어(48/64, 게이트 선형어텐션)
    - "in_proj_qkv"
    - "in_proj_z"
    - "in_proj_a"
    - "in_proj_b"
    - "out_proj"
  lora_dropout: 0.05
  bias: "none"

training:
  output_dir: "./models/qwen38-27b-react-lora-v1"
  num_train_epochs: 2                # 32B HQQ4bit 레퍼런스와 동일(78 step 재현 목적)
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8      # 실질 batch_size = 8
  learning_rate: 1.0e-4               # 32B 레퍼런스 LR 재사용(27B 미검증 — 스모크 loss 궤적으로 확인)
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  logging_steps: 10
  save_steps: 25
  save_total_limit: 2
  bf16: true                          # ROCm/cuda 백엔드
  gradient_checkpointing: true        # ⚠️ 이 yaml 키는 driver가 안 읽는다(장식용) — 실제 on/off는
                                       # 반드시 CLI --grad-ckpt로 넘겨야 한다. prepare_model_for_kbit_training은
                                       # use_gradient_checkpointing=grad_ckpt를 받아야만 켠다(자동 아님).
                                       # 2026-08-30 스모크 1차: --grad-ckpt 누락 → HQQ dequant 텐서가
                                       # backward까지 전부 살아있어 27B가 bf16 통짜(~55GB)로 상주,
                                       # OOM(HIP out of memory, 55.36GiB). 반드시 --grad-ckpt 포함할 것.
  dataloader_num_workers: 0
  remove_unused_columns: false

data:
  train_file: "./data/processed/react_train.jsonl"   # 기존 351건 그대로(증량 금지 — 앜선생 조사: 증량 시 회귀)
  val_file: "./data/processed/react_val.jsonl"
  max_seq_length: 1024                                 # 32B 레퍼런스와 동일 seq
  dataset_text_field: "text"

quantization:
  method: "hqq"                       # bitsandbytes 아님(gfx1151 wave32/64 이력 + torch2.10 cpp ext 비활성 확인됨)
  hqq_nbits: 4
  hqq_group_size: 64

# 실행 예시(--backend cuda, HQQ 4bit, 어텐션만 LoRA):
#   python src/train_directml.py --config config/training_config_qwen38_27b.yaml \
#     --backend cuda --dtype bf16 --quant hqq --hqq-nbits 4 --hqq-group-size 64 --grad-ckpt \
#     --smoke 8   # ← 반드시 먼저 8-step 스모크로 s/step 실측 후 본런 여부 판단
